services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: fast_orderbook_kafka

    ports:
      - "9092:9092"
    
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        CONTROLLER://:9093
      
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://localhost:9092,
      
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT
      
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@localhost:9093
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: fast-orderbook-airflow
    container_name: fast_orderbook_airflow

    depends_on:
      - kafka
      - postgres

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/fast-orderbook/src
      POSTGRES_DSN: >
        host=postgres
        port=5432
        dbname=fast_orderbook
        user=fast_orderbook
        password=fast_orderbook_dev

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./src:/opt/fast-orderbook/src
      - ./data:/opt/fast-orderbook/data

    working_dir: /opt/fast-orderbook

    command: >
      bash -c "
      airflow db migrate &&
      airflow standalone
      "
  postgres:
    image: postgres:17
    container_name: fast_orderbook_postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: fast_orderbook
      POSTGRES_USER: fast_orderbook
      POSTGRES_PASSWORD: fast_orderbook_dev

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fast_orderbook -d fast_orderbook"]
      interval: 5s
      timeout: 5s
      retries: 5
    
volumes:
  postgres_data: